spring:
  application:
    name: coding-agent
  config:
    import: optional:classpath:application-local.yml

deepseek:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
  request-timeout: ${DEEPSEEK_REQUEST_TIMEOUT:120s}
  thinking-enabled: ${DEEPSEEK_THINKING_ENABLED:false}

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yukina.codingagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
