spring:
  application:
    name: coding-agent
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${CODING_AGENT_DB_URL:jdbc:h2:file:./data/coding-agent;DB_CLOSE_ON_EXIT=FALSE}
    username: ${CODING_AGENT_DB_USERNAME:sa}
    password: ${CODING_AGENT_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 25MB

deepseek:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
  request-timeout: ${DEEPSEEK_REQUEST_TIMEOUT:120s}
  thinking-enabled: ${DEEPSEEK_THINKING_ENABLED:false}

agent:
  workspace-registry:
    max-workspaces: 50
    storage-root: ${CODING_AGENT_WORKSPACE_STORAGE:${user.dir}/.tmp}
  workspace-import:
    max-files: 200
    max-file-bytes: 1048576
    max-total-bytes: 20971520
  runs:
    retention: 1h
    max-runs: 200
    sse-timeout: 30m
  command:
    default-timeout: 60s
    max-timeout: 300s
    termination-grace: 2s
    max-output-chars: 20000
    max-arguments: 64
    allowed-executables:
      - java
      - javac
      - mvn
      - mvnw
      - gradle
      - gradlew
      - git
      - node
      - npm
      - npx
      - pnpm
      - yarn
      - python
      - python3
      - pytest
      - go
      - cargo
      - rustc
      - dotnet
  context:
    max-messages: 20
    max-content-chars: 16000
    ttl: 30m
    max-cached-conversations: 1000
  loop:
    max-iterations: 16
    max-tool-calls-per-iteration: 8
    trace-content-limit: 4000
    system-prompt: >
      You are a coding agent operating inside a restricted workspace. Inspect relevant files before making changes.
      Use only the provided tools, always use workspace-relative paths, and set overwrite=true only after reading an
      existing file. Prefer edit_file for localized changes to existing files, and include enough exact surrounding
      text to identify a unique match. When the task is complete, respond with a concise summary and any verification
      performed.
  workspace:
    root: ${CODING_AGENT_WORKSPACE:${user.dir}/.tmp/.runtime}
    max-read-bytes: 1048576
    max-write-bytes: 1048576
    max-list-entries: 500
    max-search-results: 200
    max-search-file-bytes: 1048576
    max-depth: 10

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yukina.codingagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
